name: 'Setup Environment'
description: 'Installs the system Python + GTK3 stack from apt (the app uses no pip) and, optionally, the converters'
inputs:
  converters:
    description: 'Also install ffmpeg, ghostscript, PyMuPDF and the other conversion tools'
    default: 'false'
  smoke:
    description: 'Also install Xvfb and D-Bus to start the real app'
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Install apt packages
      shell: bash
      env:
        CONVERTERS: ${{ inputs.converters }}
        SMOKE: ${{ inputs.smoke }}
      run: |
        PKGS="python3 python3-gi gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1 libx11-6 libxtst6 file"
        if [[ "$CONVERTERS" == "true" ]]; then
          PKGS="$PKGS ffmpeg ghostscript poppler-utils python3-pil python3-fitz python3-markdown python3-yaml \
                python3-fonttools python3-brotli heif-gdk-pixbuf librsvg2-common webp-pixbuf-loader fonts-dejavu-core"
        fi
        if [[ "$SMOKE" == "true" ]]; then
          PKGS="$PKGS xvfb dbus"
        fi
        sudo apt-get update -qq
        # shellcheck disable=SC2086
        sudo apt-get install -y -qq --no-install-recommends $PKGS > /dev/null
        /usr/bin/python3 --version
